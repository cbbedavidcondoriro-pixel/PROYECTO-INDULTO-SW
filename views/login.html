<!DOCTYPE html>
<html>
<head>
    <title>Login Sistema Indulto</title>
    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:white;
        }

        .box{
            background:#111827;
            padding:30px;
            border-radius:10px;
            width:300px;
            box-shadow:0 0 15px rgba(0,0,0,0.5);
        }

        h2{
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:none;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:10px;
            background:#22c55e;
            border:none;
            color:white;
            cursor:pointer;
            border-radius:5px;
            font-weight:bold;
        }

        button:hover{
            background:#16a34a;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>LOGIN INDULTO</h2>

    <form method="POST">
        <input type="text" name="username" placeholder="Usuario" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <button type="submit">Ingresar</button>
    </form>
</div>

</body>
</html>
